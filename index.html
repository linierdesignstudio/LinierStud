
<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linier Studio | Architecture & Contractor</title>
    <meta name="description" content="Innovation - Precision - Sustainability" />
    <link rel="icon" type="image/png" href="/LInier%20ds%20copy11.png" />
    <link rel="apple-touch-icon" href="/LInier%20ds%20copy11.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Satoshi', 'sans-serif'],
              display: ['Satoshi', 'sans-serif'],
            },
            colors: {
              neutral: {
                850: '#1f1f1f',
                900: '#121212', // Darker base
                950: '#050505', // Almost black
              },
              bronze: {
                500: '#B7FF00',
                600: '#8FCC00',
              }
            },
            animation: {
              'marquee': 'marquee 30s linear infinite',
              'spin-slow': 'spin 12s linear infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              }
            }
          },
        },
      }
    </script>
    <!-- Font: Satoshi -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,900,700,500,301,701,300,501,401,901,400&display=swap" rel="stylesheet">
    
    <style>
      body {
        cursor: auto; /* Default: Show system cursor */
        background-color: #050505;
      }

      /* Only hide system cursor on desktop where CustomCursor is active */
      @media (min-width: 768px) {
        body {
          cursor: none;
        }
      }
      
      /* Noise Overlay for Texture */
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.05;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
      
      @media (pointer: coarse) {
        body {
          cursor: auto;
        }
        .noise-overlay {
            display: none; /* Performance on mobile */
        }
      }

      /* Hide Scrollbar but keep functionality */
      ::-webkit-scrollbar {
          display: none;
          width: 0;
          height: 0;
      }
      
      html, body {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "framer-motion": "https://esm.sh/framer-motion@^12.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "clsx": "https://esm.sh/clsx@^2.1.0",
    "tailwind-merge": "https://esm.sh/tailwind-merge@^2.2.0"
  }
}
</script>
</head>
  <body class="bg-white dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 transition-colors duration-500 ease-in-out antialiased overflow-x-clip selection:bg-bronze-500 selection:text-white font-sans">
    <div class="noise-overlay"></div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
